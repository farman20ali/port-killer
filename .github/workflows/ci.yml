name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Min and max supported versions per pyproject.toml requires-python = ">=3.8"
        python-version: ["3.8", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]" pytest-cov

    - name: Run tests with coverage
      run: |
        pytest --cov=kport --cov-report=term-missing --cov-report=xml -q

    - name: Upload coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install ruff and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "ruff>=0.1.0" -e .

    - name: Run ruff
      run: ruff check src/
      
  license-drift-guard:
    name: License drift guard (no AGPL references)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Check for stale AGPL / GNU Affero references
      run: |
        # Fail the build if AGPL or GNU Affero appears anywhere outside:
        #   - .git history
        #   - CHANGELOG files
        #   - The Apache-2.0 migration guide doc (kport_apache2_license_setup.md)
        #   - The improvement plan doc (kport_improvement_plan.md) which documents the old state
        if grep -rI \
             --exclude-dir=.git \
             --exclude-dir=docs \
             --exclude="CHANGELOG*" \
             --exclude="ci.yml" \
             -l "AGPL\|GNU Affero" .; then
          echo "Stale AGPL reference found — repo license is Apache-2.0" >&2
          exit 1
        fi
        echo "✅ No stale AGPL references found."
