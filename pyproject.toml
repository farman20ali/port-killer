[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kport"
version = "3.2.6"
description = "A cross-platform command-line tool to inspect and kill processes using specific ports"
readme = "README.md"
authors = [
    { name = "Farman Ali", email = "alienhub.dev@gmail.com" }
]
license = {text = "Apache-2.0"}
license-files = ["LICENSE"]
keywords = ["port", "kill", "process", "network", "cross-platform", "cli", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
psutil = ["psutil>=5.9.0"]
mcp = ["mcp>=0.1.0"]
packaging = [
    "pyinstaller>=6.0.0",
    "build>=1.0.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.6.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0"
]

[project.urls]
"Bug Reports" = "https://github.com/farman20ali/port-killer/issues"
"Source" = "https://github.com/farman20ali/port-killer"

[project.scripts]
kport = "kport.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--tb=short"

[tool.coverage.run]
branch = true
source = ["kport"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/system_impl.py",
    "*/docker_engine.py",
    "*/notify.py",
    "*/__main__.py",
    "*/psutil_impl.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 28
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where = ["src"]
